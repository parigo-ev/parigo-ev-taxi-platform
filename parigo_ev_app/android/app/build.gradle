plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

import java.util.Properties
import java.io.FileInputStream

// ---------------------------------------------------------
// Android signing configuration
// key.properties is created by GitHub Actions during CI/CD
// ---------------------------------------------------------

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.parigo_ev"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.parigo.evapp"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // ---------------------------------------------------------
    // Release signing
    // ---------------------------------------------------------
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {

                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storePassword = keystoreProperties["storePassword"]

                def storeFilePath = keystoreProperties["storeFile"]

                if (storeFilePath != null && storeFilePath.toString().trim()) {
                    storeFile = file(storeFilePath)
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release

            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.core:core:1.13.1'
    }
}
