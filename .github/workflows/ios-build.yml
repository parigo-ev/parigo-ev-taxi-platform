name: Build iOS Flutter App

on:
  push:
    branches:
      - ios-test
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Flutter iOS
    runs-on: macos-latest

    defaults:
      run:
        working-directory: parigo_ev_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Check iOS deployment target
        working-directory: parigo_ev_app/ios
        run: |
          echo "Podfile:"
          grep "platform :ios" Podfile

      - name: Install CocoaPods
        working-directory: parigo_ev_app/ios
        run: |
          pod deintegrate || true
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update

      - name: Build Flutter iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Create Xcode archive
        working-directory: parigo_ev_app/ios
        run: |
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: parigo-ev-ios-archive
          path: ${{ runner.temp }}/Runner.xcarchive
          retention-days: 7

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: parigo-ev-ios-build
          path: parigo_ev_app/build/ios/iphoneos/Runner.app
          retention-days: 7
